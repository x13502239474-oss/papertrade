name = "papertrade-ashare-proxy"
main = "src/index.js"
compatibility_date = "2026-01-01"

[vars]
# 可选值：public（默认，腾讯+新浪公开接口）| tushare | itick
UPSTREAM = "public"
# 仅允许你的 GitHub Pages 域名跨域访问（本地开发可追加 http://localhost:4173）
ALLOWED_ORIGINS = "https://x13502239474-oss.github.io,http://localhost:4173,http://127.0.0.1:4173"
# 边缘缓存秒数，降低上游限流风险
CACHE_TTL_SEC = "5"

# 敏感密钥不要写在本文件中！请使用 Wrangler Secret 注入：
#   npx wrangler secret put TUSHARE_TOKEN
#   npx wrangler secret put ITICK_TOKEN
